services:
  viewer:
    build: .
    ports:
      - '${VIEWER_PORT:-8888}:8888'
    environment:
      LOCALSTACK_ENDPOINT: ${LOCALSTACK_ENDPOINT:-http://host.docker.internal:4566}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
